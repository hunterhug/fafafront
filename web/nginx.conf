# 后端 upstream 使用 zone + resolve 做运行时动态解析。
#
# 背景：
# nginx 对 proxy_pass 里的**静态主机名**只在配置加载时解析一次并缓存 IP。
# 后端容器（fafacms）被重建后 IP 会变化，前端仍在往旧 IP 发请求 → 502；
# 更糟的是旧 IP 可能被 Docker 分给别的容器，请求会被转发到错误的服务。
#
# 修复：用 upstream + `resolve`（nginx ≥1.27.3）让 nginx 按 TTL 重新解析。
# 注意不要改用「变量 + proxy_pass」——那样 nginx 会失去 /app/ → / 的前缀重写语义。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fafa_backend {
    zone fafa_backend 64k;
    server __BACKEND_UPSTREAM__ resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的构建产物：可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 与 favicon 不能长缓存：
    # 每次发版 index.html 引用的 assets 文件名都会变，旧的 index.html 会指向已经不存在的
    # chunk（加上 SPA 回退还会把这些请求变成 index.html 本身），用户就会看到旧界面或白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 公开接口 /app/xxx -> 后端 /xxx
    location /app/ {
        proxy_pass http://fafa_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录后接口 /api/xxx -> 后端 /v1/xxx
    location /api/ {
        # 上传接口 /api/file/upload 走这里，必须放开请求体上限。
        # nginx 默认只有 1m，超过就直接返回 HTML 的 413 页面，浏览器只能显示
        # "413 Request Entity Too Large"，前端拿不到后端的中文错误提示。
        # 后端自己的上限是 32MiB（FileBytes = 1<<25），这里给到 40m 留出 multipart
        # 开销，让超限文件能进到后端并返回结构化错误码 100102「文件超过大小限制」。
        client_max_body_size 40m;

        proxy_pass http://fafa_backend/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件 /storage、缩略图 /storage_x
    location /storage/ {
        proxy_pass http://fafa_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /storage_x/ {
        proxy_pass http://fafa_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
